<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#070E1C" />
  <circle cx="256" cy="256" r="210" fill="#0C1B33" stroke="#00B4D8" stroke-width="8" />
  
  <!-- Light Beam from Lighthouse -->
  <path d="M256 140 L440 40 L460 120 Z" fill="url(#beamGrad)" opacity="0.4" />
  <path d="M256 140 L72 40 L52 120 Z" fill="url(#beamGrad)" opacity="0.4" />

  <!-- Lighthouse Body -->
  <path d="M256 90 L290 140 H222 L256 90 Z" fill="#FFC400" stroke="#FFC400" stroke-width="4" />
  <path d="M232 140 L212 370 H300 L280 140 Z" fill="#00B4D8" stroke="#38BDF8" stroke-width="6" />
  
  <!-- Red & White Stripes -->
  <path d="M225 210 H287 L283 260 H229 Z" fill="#EF4444" />
  <path d="M229 260 H283 L279 310 H233 Z" fill="#FFFFFF" />

  <!-- Base Rock -->
