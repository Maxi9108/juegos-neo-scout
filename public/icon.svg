  <!-- Fleur-de-lis Emblem in Center -->
  <path d="M256 185 C250 200, 244 216, 244 228 C244 240, 268 240, 268 228 C268 216, 262 200, 256 185 Z" fill="#FFC400" stroke="#B45309" stroke-width="2" />
  <path d="M244 226 C234 214, 220 220, 222 232 C226 242, 242 240, 246 234 Z" fill="#FFC400" stroke="#B45309" stroke-width="2" />
  <path d="M268 226 C278 214, 292 220, 290 232 C286 242, 270 240, 266 234 Z" fill="#FFC400" stroke="#B45309" stroke-width="2" />
  <rect x="238" y="240" width="36" height="8" rx="4" fill="#B45309" />

  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC400" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
